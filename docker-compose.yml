version: "3.9"

services:
  app:
    build:
      context: ./docker/app
      dockerfile: Dockerfile
    container_name: photos_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      - PHP_IDE_CONFIG=serverName=laravel
    networks:
      - backend

  web:
    image: nginx:1.27-alpine
    container_name: photos_web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - backend

  db:
    image: mysql:8.0
    container_name: photos_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: photos
      MYSQL_USER: photos
      MYSQL_PASSWORD: photos
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend

  queue:
    build:
      context: ./docker/app
      dockerfile: Dockerfile
    container_name: photos_queue
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: sh -lc "php artisan queue:work --tries=3 --timeout=90"
    depends_on:
      - app
      - db
    networks:
      - backend

  scheduler:
    build:
      context: ./docker/app
      dockerfile: Dockerfile
    container_name: photos_scheduler
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: sh -lc "while [ true ]; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    depends_on:
      - app
      - db
    networks:
      - backend

  node:
    image: node:20-alpine
    container_name: photos_node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - backend

volumes:
  db_data:

networks:
  backend:
