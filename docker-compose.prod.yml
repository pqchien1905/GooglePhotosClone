version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile.prod
      target: production
    container_name: photos_app_prod
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    networks:
      - backend
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    image: nginx:1.27-alpine
    container_name: photos_web_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: mysql:8.0
    container_name: photos_db_prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: ${DB_DATABASE:-photos}
      MYSQL_USER: ${DB_USERNAME:-photos}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/backups:/backups
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - backend
    command: --default-authentication-plugin=mysql_native_password --max_allowed_packet=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5

  queue:
    build:
      context: .
      dockerfile: docker/app/Dockerfile.prod
      target: production
    container_name: photos_queue_prod
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    command: php artisan queue:work --tries=3 --timeout=90 --sleep=3 --max-jobs=1000
    depends_on:
      - app
      - db
    networks:
      - backend
    environment:
      - APP_ENV=production
      - APP_DEBUG=false

  scheduler:
    build:
      context: .
      dockerfile: docker/app/Dockerfile.prod
      target: production
    container_name: photos_scheduler_prod
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    command: sh -c "while [ true ]; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    depends_on:
      - app
      - db
    networks:
      - backend
    environment:
      - APP_ENV=production
      - APP_DEBUG=false

volumes:
  db_data:
    driver: local

networks:
  backend:
    driver: bridge

